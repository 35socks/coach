<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0a1730"><meta name="mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ayr driver ticketing (test)</title>
<style>
:root{--bg:#eef2f8;--panel:#fff;--ink:#0c1b33;--mute:#51627f;--line:#cbd6e8;--accent:#c75f00;--onaccent:#fff;--ok:#16794a;--bad:#c2312f;--paper:#f7f3e8;--paperink:#1a1a1a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1730;--panel:#14284a;--ink:#f2f5fa;--mute:#9fb0cc;--line:#27406b;--accent:#ff8a1f;--onaccent:#1a0d00;--ok:#2fbf71;--bad:#ff6b68}}
:root[data-theme="dark"]{--bg:#0a1730;--panel:#14284a;--ink:#f2f5fa;--mute:#9fb0cc;--line:#27406b;--accent:#ff8a1f;--onaccent:#1a0d00;--ok:#2fbf71;--bad:#ff6b68}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Barlow,system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 14px 92px}
h1,h2,.num,.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:600;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;font:inherit;font-size:20px;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{font:600 18px Barlow,sans-serif;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:12px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.go,.seg button[aria-pressed=true]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.top button{flex:none;font-size:15px;padding:8px 10px}
.hero{background:var(--accent);color:var(--onaccent);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.hero .big{font-size:46px;line-height:1}.hero .row{margin-top:8px}.hero button{background:rgba(0,0,0,.2);color:inherit;border-color:transparent}
.fares{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fare{min-height:92px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.fare .big{font-size:36px;line-height:1}.fare.nec{grid-column:1/-1;min-height:60px;flex-direction:row;align-items:center}
.mute{color:var(--mute)}.err{color:var(--bad);font-weight:600;min-height:24px;margin-top:8px}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li.void{text-decoration:line-through;opacity:.5}
.list button{width:100%;text-align:left;border:0;background:none;padding:0;font-size:17px;display:flex;justify-content:space-between;gap:8px}
.list li.cur{border-left:6px solid var(--accent);padding-left:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stats .num{font-size:28px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;border-radius:0;padding:16px 4px;background:none}.tabs button[aria-current=page]{color:var(--accent);box-shadow:inset 0 3px var(--accent)}
#sheet{position:fixed;inset:0;background:rgba(5,12,25,.6);display:none;align-items:flex-end;justify-content:center;z-index:5}
#sheet.on{display:flex}
.card{background:var(--panel);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.receipt{background:var(--paper);color:var(--paperink);padding:16px;border-radius:4px;font-family:"Barlow Condensed",sans-serif;font-size:20px;border-top:6px dotted var(--accent)}
.receipt .big{font-size:44px}.receipt p{margin:2px 0}.change{font-size:34px;color:var(--ok)}
.card.auto{animation:up .35s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.done{text-align:center;margin-bottom:8px}
.ring{stroke-dasharray:151;stroke-dashoffset:151;animation:dr .5s .1s ease-out forwards}
.tick{stroke-dasharray:40;stroke-dashoffset:40;animation:dr .35s .5s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.receipt.print{animation:pr .8s .2s steps(16,end) both}
@keyframes pr{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
.card.auto.leave .receipt{transition:transform .5s ease-in,opacity .5s;transform:translateY(-120px) rotate(-5deg);opacity:0}
.card.auto.leave{transition:opacity .5s .1s;opacity:0}
#sheet{transition:opacity .5s}#sheet.fade{opacity:0}
@media (prefers-reduced-motion:reduce){.card.auto,.ring,.tick,.receipt.print{animation:none;stroke-dashoffset:0}}
.wait{text-align:center;padding:12px 0 18px}
.pulse{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;background:var(--accent);color:var(--accent);animation:pl 1s ease-out infinite}
@keyframes pl{from{box-shadow:0 0 0 0 currentColor}to{box-shadow:0 0 0 38px transparent}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>

"6":["Carrick Street","Burns Statue Square","Ashgrove Street","Kyle Street","Newmarket Street","Police Station","Newton Primary School"].concat(px("Whitletts, ",["Burnett Terrace","Hawkhill Avenue (near)","Hawkhill Avenue","Walker Road (near)","Walker Road (29)","Wilson Street"]),px("Newton-On-Ayr, ",["Britannia Place","St Georges Road","Cambuslea Road"]),px("Heathfield, ",["East Park Road","Tweed Street","Stewart Road","Heathfield Road","Heathpark","Mosside Road","Parks Garage","Asda Superstore","Parks Garage (2)","Moor Park Place","Ardfin Road"]),px("Prestwick, ",["Calvinston Road","Fairview","Moorefield Road","Rowallan Crescent","Outdale Avenue","Sanquhar Avenue","Raith Avenue","Sanquhar Avenue (2)","Adamton Road","Sherwood Road","Shaw Road","Newdykes Road","McNeill Avenue","Merrick Avenue","Berelands Road","The Cross","Saunterne Road","Gardiner Street","St Quivox Road","Southpark Avenue","Meadowbank Lane","Mansfield Road","Crandleyhill Road","Waterloo Road"]),px("Heathfield, ",["Pleasantfield Road","Woodfield Avenue","Kirkholm Avenue"]),px("Newton-On-Ayr, ",["Alderston Avenue","Northfield Avenue","McCalls Avenue"]),["Waggon Road (2)","Waggon Road","Crown Street","Cathcart Street","Carrick Street (end)"]),

"306":["Newmarket Street","Police Station","Newton Primary School","Whitletts, Burnett Terrace","Whitletts, Hawkhill Avenue","Whitletts, Walker Road","Newton-On-Ayr, Britannia Place","St Georges Road","Cambuslea Road","Heathfield, East Park Road","Heathfield, Stewart Road","Heathfield, Mosside Road","Parks Garage","Alderston Avenue","Northfield Avenue","McCalls Avenue","Waggon Road","Crown Street","Cathcart Street","Carrick Street","Fullarton Street"]
};
ST.X77K=ST["4"];ST.X77=ST["4"];
var RT=[["1","Masonhill – Hayhill"],["2","Carrick Street circular (via Prestwick)"],["2A","Town Centre – Citadel Leisure Centre"],["3","Snowdrop Square circular"],["3B","Kincaidston – James Brown Avenue"],["4","Glasgow Buchanan – Ayr"],["6","Boswell Park circular (via Prestwick)"],["9","Ayr – Doonfoot"],["14","Ayr Hospital – Irvine"],["42","Ayr – Muirkirk"],["42A","Ayr – Cumnock"],["X42","Ayr – Muirkirk (express)"],["43","Ayr – New Cumnock"],["43A","Ayr – Annbank"],["52","Ayr – Bellsbank"],["58","Ayr – Girvan"],["60","Ayr – Girvan"],["61","Ayr – Dunure"],["97","Ayr – Craig Tara"],["301","Fullarton Street – Holmston"],["302","Prestwick – Ayr"],["306","Marchburn – Hillfoot Road"],["343","Ayr – New Cumnock"],["352","Ayr – Burnton"],["358","Ayr – Stranraer"],["360","Ayr – Stranraer"],["585","Largs – Ayr"],["X77","Hillhead – Alloway"],["X77K","Glasgow – Ayr"]];
var ENDS={"3B":["Kincaidston Drive","James Brown Avenue"],"1":["Dunlop Terrace","Castlehill Masonhill Road"],"6":["Boswell Park","Boswell Park"],"9":["Ayr","Doonfoot"],"14":["Ayr Hospital","Irvine High Street"],"42":["Ayr Bus Station","Muirkirk"],"42A":["Ayr Bus Station","Cumnock"],"X42":["Ayr Bus Station","Muirkirk"],"43":["Ayr Bus Station","New Cumnock"],"43A":["Ayr Bus Station","Annbank"],"52":["Ayr Bus Station","Bellsbank"],"58":["Ayr Bus Station","Girvan"],"60":["Ayr Bus Station","Girvan"],"61":["Ayr Bus Station","Dunure"],"97":["Ayr Bus Station","Craig Tara"],"301":["Fullarton Street","Holmston"],"343":["Ayr Bus Station","New Cumnock"],"352":["Ayr Bus Station","Burnton"],"358":["Ayr Bus Station","Stranraer"],"360":["Ayr Bus Station","Stranraer"],"585":["Largs","Ayr Bus Station"],"X77":["Alloway Burns Museum","Hillhead University"]};
var KEY="ayrtest.v2",S={op:null,veh:"",route:"2A",dir:0,cur:0,tab:"sell",q:"",tickets:[],seq:0},P=null,fails=0,lockUntil=0,msg="";
try{var r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function gbp(p){return "£"+(p/100).toFixed(2)}
function hhmm(t){return new Date(t).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}
function $(s){return document.querySelector(s)}
function stops(){var a=ST[S.route]||ENDS[S.route]||["Ayr Bus Station","End of route"];return S.dir?a.slice().reverse():a}
function known(){return !!ST[S.route]}
function live(){return S.tickets.filter(function(t){return!t.v})}
function sum(m){return live().filter(function(t){return t.m===m}).reduce(function(a,t){return a+t.amt},0)}
function nec(){return live().filter(function(t){return t.m==="nec"}).reduce(function(a,t){return a+t.q},0)}
async function sha(t){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
async function login(){
  if(Date.now()<lockUntil){msg="Locked. Try again in "+Math.ceil((lockUntil-Date.now())/1000)+" seconds.";return view()}
  var id=$("#id").value.trim(),pin=$("#pin").value;
  if(USERS[id]&&USERS[id]===await sha(id+":"+pin)){S.op=id;S.veh=$("#veh").value.trim();S.tab="sell";fails=0;msg="";save()}
  else{fails++;if(fails>=3){lockUntil=Date.now()+30000;fails=0;msg="Too many attempts. Locked for 30 seconds."}else msg="Operator ID or PIN not recognised."}
  view()
}
function tab(t){S.tab=t;save();view()}
function view(){
  var a=$("#app");
  if(!S.op){
    a.innerHTML='<div class="panel"><h1>Ayr ticketing</h1><p class="mute">Test build. Sign in to start a shift.</p>'+
    '<label for="id">Operator ID</label><input id="id" inputmode="numeric" autocomplete="off">'+
    '<label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off">'+
    '<label for="veh">Vehicle number</label><input id="veh" autocomplete="off" placeholder="Optional">'+
    '<p class="err" role="alert">'+msg+'</p><button class="go" style="width:100%" onclick="login()">Sign in</button></div>';
    $("#pin").addEventListener("keydown",function(e){if(e.key==="Enter")login()});$("#tabs")&&$("#tabs").remove();return}
  var h={sell:sell,route:route,log:log,shift:shift}[S.tab]();
  var tb=[["sell","Sell"],["route","Route"],["log","Tickets"],["shift","Shift"]].map(function(x){return '<button onclick="tab(\''+x[0]+'\')"'+(S.tab===x[0]?' aria-current="page"':'')+'>'+x[1]+'</button>'}).join("");
  a.innerHTML=h+'<nav class="tabs" id="tabs">'+tb+'</nav>'
}
function hero(){var s=stops(),to=s[s.length-1];return '<div class="hero"><span>Route '+S.route+' to '+to+'</span><div class="big">'+s[S.cur]+'</div><div class="row"><button onclick="step(-1)" '+(S.cur?'':'disabled')+'>Previous stop</button><button onclick="step(1)" '+(S.cur<s.length-1?'':'disabled')+'>Next stop</button></div></div>'}
function step(d){S.cur=Math.max(0,Math.min(stops().length-1,S.cur+d));save();view()}
function sell(){
  return '<div class="top"><div><h2>Operator '+S.op+(S.veh?' / Bus '+S.veh:'')+'</h2><span class="mute">Shift tickets: '+live().length+'</span></div></div>'+hero()+
  '<div class="fares">'+FARES.map(function(f){return '<button class="fare" onclick="pay(\''+f.id+'\')"><span>'+f.name+'<br><span class="mute" style="font-size:14px">'+f.sub+'</span></span><span class="big">'+gbp(f.p)+'</span></button>'}).join("")+
  '<button class="fare nec" onclick="pay(\'nec\')"><span>Free travel (National Entitlement Card)</span><span class="big">£0.00</span></button></div>'
}
function route(){
  var q=S.q.toLowerCase(),rs=RT.filter(function(x){return(x[0]+" "+x[1]).toLowerCase().indexOf(q)>-1}),s=stops();
  return '<div class="panel"><div class="top"><h2>Route '+S.route+'</h2><button onclick="S.dir=S.dir?0:1;S.cur=0;save();view()">Reverse direction</button></div>'+
  (known()?'':'<p class="mute">Only the end points are loaded for this route. Full stop list needed from Stagecoach data.</p>')+
  '<ul class="list">'+s.map(function(x,i){return '<li class="'+(i===S.cur?'cur':'')+'"><button onclick="S.cur='+i+';save();tab(\'sell\')"><span>'+x+'</span>'+(i===S.cur?'<b>Here</b>':'')+'</button></li>'}).join("")+'</ul></div>'+
  '<div class="panel"><h2>Change route</h2><label for="q">Search number or place</label><input id="q" value="'+S.q+'" oninput="S.q=this.value;view();var e=$(\'#q\');e.focus();e.setSelectionRange(99,99)"><ul class="list">'+
  rs.map(function(x){return '<li><button onclick="S.route=\''+x[0]+'\';S.dir=0;S.cur=0;S.q=\'\';save();view()"><b>'+x[0]+'</b><span>'+x[1]+'</span></button></li>'}).join("")+'</ul></div>'
}
function log(){
  return '<div class="top"><h2>Tickets</h2><button onclick="voidLast()" '+(live().length?'':'disabled')+'>Void last</button></div><div class="panel">'+

}
function shift(){
  var un=S.tickets.filter(function(t){return!t.s}).length;
  return '<div class="top"><h2>Shift</h2></div><div class="panel"><div class="stats"><div><div class="num">'+gbp(sum("cash"))+'</div><span class="mute">Cash</span></div><div><div class="num">'+gbp(sum("contactless"))+'</div><span class="mute">Contactless</span></div><div><div class="num">'+nec()+'</div><span class="mute">NEC</span></div></div></div>'+
  '<div class="panel"><p>Tickets issued: <b>'+live().length+'</b></p><p>Unsynced: <b>'+un+'</b></p></div><div class="row"><button onclick="sync()">Sync ('+un+')</button><button class="go" onclick="endShift()">End shift</button></div>'
}
function openSheet(h){$("#card").className="card";$("#card").innerHTML=h;$("#sheet").classList.remove("fade");$("#sheet").classList.add("on")}
var tm=null;
function closeSheet(){clearTimeout(tm);P=null;$("#sheet").classList.remove("on","fade");$("#card").classList.remove("leave","auto");view()}
$("#sheet").addEventListener("click",function(e){if(e.target.id==="sheet"&&$("#card").classList.contains("auto"))closeSheet()});
function pay(id){var s=stops();P={f:id==="nec"?{id:"nec",name:"Free travel (NEC)",p:0}:FARES.filter(function(x){return x.id===id})[0],q:1,m:id==="nec"?"nec":"contactless",tender:0,to:s.length-1};if(P.to<=S.cur)P.to=Math.min(S.cur+1,s.length-1);sheet()}
function setP(k,v){P[k]=v;sheet()}
function sheet(){
  var tot=P.f.p*P.q,ok=P.m!=="cash"||P.tender>=tot,isN=P.m==="nec",s=stops();
  openSheet('<h2>'+P.f.name+'</h2><label for="to">Destination</label><select id="to" onchange="setP(\'to\',+this.value)">'+s.map(function(x,i){return i>S.cur||s.length===1?'<option value="'+i+'"'+(i===P.to?' selected':'')+'>'+x+'</option>':''}).join("")+'</select>'+
  '<div class="row" style="margin:10px 0"><button onclick="setP(\'q\',Math.max(1,P.q-1))" aria-label="Fewer passengers">-</button><div class="big" style="font-size:34px;text-align:center">'+P.q+(P.q>1?' passengers':' passenger')+'</div><button onclick="setP(\'q\',Math.min(9,P.q+1))" aria-label="More passengers">+</button></div>'+
  '<div class="big" style="font-size:52px">'+gbp(tot)+'</div>'+
  (isN?'':'<div class="seg" style="grid-template-columns:1fr 1fr"><button aria-pressed="'+(P.m==="contactless")+'" onclick="setP(\'m\',\'contactless\')">Contactless</button><button aria-pressed="'+(P.m==="cash")+'" onclick="setP(\'m\',\'cash\')">Cash</button></div>')+
  (P.m==="cash"?'<div class="seg" style="grid-template-columns:repeat(4,1fr)">'+[tot,500,1000,2000].map(function(v,i){return '<button aria-pressed="'+(P.tender===v)+'" onclick="setP(\'tender\','+v+')">'+(i?gbp(v):'Exact')+'</button>'}).join("")+'</div><p>Change due</p><div class="change num">'+(P.tender>=tot?gbp(P.tender-tot):"-")+'</div>':'')+
  '<div class="row" style="margin-top:12px"><button onclick="closeSheet()">Cancel</button><button class="go" '+(ok?'':'disabled')+' onclick="issue()">'+(isN?"Scan card":P.m==="cash"?"Take cash and issue":"Tap card")+'</button></div>')
}
function issue(){
  if(P.m==="cash")return issueNow();
  openSheet('<div class="wait"><div class="pulse"></div><h2>Waiting for scan</h2><p class="mute">'+(P.m==="nec"?"Hold the National Entitlement Card on the reader":"Hold the card on the reader")+'</p></div><button style="width:100%" onclick="closeSheet()">Cancel</button>');
  clearTimeout(tm);tm=setTimeout(issueNow,2000)
}
function issueNow(){
  if(!P)return;var s=stops();S.seq++;
  var t={n:S.op+"-"+String(S.seq).padStart(4,"0"),t:Date.now(),f:P.f.name,q:P.q,amt:P.f.p*P.q,m:P.m,route:S.route,from:s[S.cur],to:s[P.to],veh:S.veh,s:false};
  S.tickets.push(t);save();P=null;
  openSheet('<div class="done"><svg viewBox="0 0 52 52" width="64" height="64" aria-hidden="true"><circle class="ring" cx="26" cy="26" r="24" fill="none" stroke="var(--ok)" stroke-width="3"/><path class="tick" d="M14 27l8 8 16-17" fill="none" stroke="var(--ok)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="receipt print"><p>Ayr test ticket</p><p class="big">'+t.f+' x'+t.q+'</p><p>'+gbp(t.amt)+' ('+t.m+')</p><p>Route '+t.route+'</p><p>'+t.from+' to '+t.to+'</p><p>'+hhmm(t.t)+' / '+t.n+'</p></div><p class="mute" style="text-align:center;margin:10px 0 0" role="status">Ticket issued</p>');
  $("#card").classList.add("auto");clearTimeout(tm);
  tm=setTimeout(function(){$("#card").classList.add("leave");$("#sheet").classList.add("fade");tm=setTimeout(closeSheet,560)},1900)
}
function voidLast(){var l=live();if(l.length){l[l.length-1].v=true;save();view()}}
function sync(){setTimeout(function(){S.tickets.forEach(function(t){t.s=true});save();view()},600)}
function endShift(){
  openSheet('<h2>End shift</h2><div class="panel"><p>Tickets issued: <b>'+live().length+'</b></p><p>Cash to hand in: <b>'+gbp(sum("cash"))+'</b></p><p>Contactless taken: <b>'+gbp(sum("contactless"))+'</b></p><p>NEC free journeys: <b>'+nec()+'</b></p></div><div class="row"><button onclick="closeSheet()">Back</button><button class="go" onclick="signOff()">Sign off and clear shift</button></div>')
}
function signOff(){S.op=null;S.tickets=[];S.seq=0;S.cur=0;save();closeSheet()}
view();
</script>
</body>
</html>
