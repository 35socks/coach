function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function pk(k){if(k==="x")pin=pin.slice(0,-1);else if(pin.length<8)pin+=k;buzz(8);dotsEl()}
function dotsEl(){var h="";for(var i=0;i<Math.max(4,pin.length);i++)h+='<i class="'+(i<pin.length?"on":"")+'"></i>';$("#dots").innerHTML=h}
function bar(){return '<header class="bar"><b>Stagecoach West Scotland</b><span>'+(S.op?"Operator "+S.op+(S.veh?" · Bus "+S.veh:""):"Ayr test")+'</span><button class="th" onclick="cyc()" aria-label="Change theme">'+({auto:"Auto",light:"Light",dark:"Dark"}[S.theme||"auto"])+'</button></header>'}
function tab(t){S.tab=t;save();view()}
function view(){
  var a=$("#app");
  if(!S.op){
    a.innerHTML=bar()+'<div class="login"><h1>Driver sign in</h1><label for="id">Operator ID</label><input id="id" inputmode="numeric" autocomplete="off" value="'+idv+'"><label for="veh">Vehicle number</label><input id="veh" autocomplete="off" placeholder="Optional" value="'+vehv+'"><div id="dots" class="dots"></div><p class="err" role="alert">'+msg+'</p><div class="pad">'+["1","2","3","4","5","6","7","8","9","x","0","go"].map(function(k){return k==="go"?'<button class="go" onclick="login()">Sign in</button>':'<button onclick="pk(\''+k+'\')">'+(k==="x"?"Del":k)+'</button>'}).join("")+'</div></div>';
    dotsEl();return}
  var h={sell:sell,route:route,log:log,shift:shift}[S.tab]();
  var tb=[["sell","Sell"],["route","Route"],["log","Tickets"],["shift","Shift"]].map(function(x){return '<button onclick="tab(\''+x[0]+'\')"'+(S.tab===x[0]?' aria-current="page"':'')+'>'+x[1]+'</button>'}).join("");
  a.innerHTML=bar()+"<main>"+h+'</main><nav class="tabs">'+tb+'</nav>';
  if(S.tab==="route")setTimeout(function(){var e=document.querySelector(".tl .cur");if(e)e.scrollIntoView({block:"center"})},40)
}
function hero(){var s=stops(),n=s.length,c=Math.min(S.cur,n-1);
  return '<section class="hero"><div class="rt"><b class="pill">'+S.route+'</b><span>to '+s[n-1]+'</span><em>'+(c+1)+' / '+n+'</em></div><small>Now at</small><div class="now">'+s[c]+'</div><div class="nx">'+(c<n-1?"Next: "+s[c+1]:"Final stop")+'</div><div class="prog"><i style="width:'+((c+1)/n*100)+'%"></i></div><div class="row"><button onclick="step(-1)" '+(c?"":"disabled")+'>Previous</button><button class="nxt" onclick="step(1)" '+(c<n-1?"":"disabled")+'>Next stop</button></div></section>'}
function step(d){S.cur=Math.max(0,Math.min(stops().length-1,S.cur+d));save();buzz(10);view()}
function sell(){
  return hero()+'<div class="fares">'+FARES.map(function(f){return '<button class="fare" onclick="pay(\''+f.id+'\')"><span class="fn">'+f.name+'</span><span class="fs">'+f.sub+'</span><span class="fp">'+gbp(f.p)+'</span></button>'}).join("")+
  '<button class="fare nec" onclick="pay(\'nec\')"><span class="fn">Free travel</span><span class="fs">National Entitlement Card</span><span class="fp">£0.00</span></button></div>'+
  '<div class="chips"><div><b>'+live().length+'</b><span>Tickets</span></div><div><b>'+gbp(sum("cash"))+'</b><span>Cash</span></div><div><b>'+gbp(sum("contactless"))+'</b><span>Card</span></div></div>'}
function rl(){var q=S.q.toLowerCase();
  var h=RT.filter(function(r){return !q||(r[0]+" "+r[1]).toLowerCase().indexOf(q)>-1||(q.length>2&&ST[r[0]].some(function(a){return a.some(function(i){return N[i].toLowerCase().indexOf(q)>-1})}))}).map(function(r){return '<button class="rc" aria-pressed="'+(r[0]===S.route)+'" onclick="pickR(\''+r[0]+'\')">'+r[0]+'</button>'}).join("");
  return h||'<p class="mute">No routes found.</p>'}
function pickR(r){S.route=r;S.dir=0;S.cur=0;S.q="";save();buzz(10);view()}
function fq(v){S.q=v;$("#rl").innerHTML=rl()}
function route(){var s=stops();
  return '<div class="top"><div class="row" style="align-items:center;gap:12px"><b class="pill big" style="flex:none">'+S.route+'</b><div><b>'+(RD[S.route]||"")+'</b><small>'+(S.dir?"Return":"Outbound")+" · "+s.length+' stops</small></div></div><button onclick="S.dir=S.dir?0:1;S.cur=0;save();view()">Reverse</button></div>'+
  '<input id="q" placeholder="Search route number or place" value="'+S.q+'" oninput="fq(this.value)"><div class="rcs" id="rl">'+rl()+'</div>'+
  '<ul class="tl">'+s.map(function(x,i){return '<li class="'+(i<S.cur?"past":i===S.cur?"cur":"")+'"><button onclick="S.cur='+i+';save();tab(\'sell\')">'+x+(i===S.cur?"<em>Here</em>":"")+'</button></li>'}).join("")+'</ul>'}
function log(){
  return '<div class="top"><h2>Tickets</h2><button onclick="voidLast()" '+(live().length?"":"disabled")+'>Void last</button></div>'+
  (S.tickets.length?'<ul class="tk">'+S.tickets.slice().reverse().map(function(t){return '<li class="'+(t.v?"void":"")+'"><b class="pill">'+t.route+'</b><div><b>'+t.f+" × "+t.q+'</b><small>'+t.from+" to "+t.to+'</small><small>'+hhmm(t.t)+" · "+t.n+(t.s?"":" · unsynced")+'</small></div><b>'+gbp(t.amt)+'</b></li>'}).join("")+'</ul>':'<p class="empty">No tickets yet.<br>Choose a fare on the Sell tab.</p>')}
function shift(){var un=S.tickets.filter(function(t){return!t.s}).length;
  return '<h2 class="ph">Shift</h2><div class="chips"><div><b>'+gbp(sum("cash"))+'</b><span>Cash</span></div><div><b>'+gbp(sum("contactless"))+'</b><span>Card</span></div><div><b>'+nec()+'</b><span>NEC</span></div></div>'+
  '<div class="panel"><div class="r2"><span>Tickets issued</span><b>'+live().length+'</b></div><div class="r2"><span>Unsynced</span><b>'+un+'</b></div><div class="r2"><span>Vehicle</span><b>'+(S.veh||"Not set")+'</b></div></div><div class="row"><button onclick="sync()">Sync ('+un+')</button><button class="go" onclick="endShift()">End shift</button></div>'}
function openSheet(h,mid){var c=$("#card");c.className=mid?"card bare":"card";c.innerHTML=h;var s=$("#sheet");s.classList.remove("fade");s.classList.toggle("mid",!!mid);s.classList.add("on")}
function closeSheet(){clearTimeout(tm);P=null;var s=$("#sheet");s.classList.remove("on","fade","mid");view()}
function pay(id){var s=stops();P={f:id==="nec"?{id:"nec",name:"Free travel",p:0}:FARES.filter(function(x){return x.id===id})[0],q:1,m:id==="nec"?"nec":"contactless",tender:0,to:s.length-1};if(P.to<=S.cur)P.to=Math.min(S.cur+1,s.length-1);buzz(10);paySheet()}
function setP(k,v){P[k]=v;paySheet()}
function paySheet(){
  var s=stops(),tot=P.f.p*P.q,isN=P.m==="nec",cash=P.m==="cash",ok=!cash||P.tender>=tot;
  openSheet('<div class="grab"></div><div class="merch"><b class="pill">'+S.route+'</b><div><b>Stagecoach West Scotland</b><small>'+s[S.cur]+" to "+s[P.to]+'</small></div></div><div class="rows">'+
  '<div class="r"><span>Ticket</span><b>'+P.f.name+'</b></div>'+
  '<div class="r"><span>Destination</span><select aria-label="Destination" onchange="setP(\'to\',+this.value)">'+s.map(function(x,i){return i>S.cur||s.length===1?'<option value="'+i+'"'+(i===P.to?" selected":"")+'>'+x+'</option>':""}).join("")+'</select></div>'+
  '<div class="r"><span>Passengers</span><div class="st"><button onclick="setP(\'q\',Math.max(1,P.q-1))" aria-label="Fewer">-</button><b>'+P.q+'</b><button onclick="setP(\'q\',Math.min(9,P.q+1))" aria-label="More">+</button></div></div>'+
  (isN?"":'<div class="r"><span>Pay with</span><div class="seg2"><button aria-pressed="'+!cash+'" onclick="setP(\'m\',\'contactless\')">Card</button><button aria-pressed="'+cash+'" onclick="setP(\'m\',\'cash\')">Cash</button></div></div>')+'</div>'+
  (cash?'<div class="tend">'+[tot,500,1000,2000].map(function(v,i){return '<button aria-pressed="'+(P.tender===v)+'" onclick="setP(\'tender\','+v+')">'+(i?gbp(v):"Exact")+'</button>'}).join("")+'</div><div class="chg"><span>Change due</span><b>'+(P.tender>=tot?gbp(P.tender-tot):"-")+'</b></div>':"")+
  '<div class="tot"><span>Total</span><b>'+gbp(tot)+'</b></div><button class="pp" '+(ok?"":"disabled")+' onclick="issue()">'+(isN?"Scan card":cash?"Take cash":"Pay "+gbp(tot))+'</button><button class="lnk" onclick="closeSheet()">Cancel</button>')
}
function issue(){
  if(P.m==="cash")return done();
  openSheet('<div class="hold"><div class="wv"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" aria-hidden="true"><path class="a1" d="M22 42a14 14 0 0 0 0-20"/><path class="a2" d="M31 49a24 24 0 0 0 0-34"/><path class="a3" d="M40 56a34 34 0 0 0 0-48"/></svg></div><h2>'+(P.m==="nec"?"Hold card near reader":"Hold Near Reader")+'</h2><p>'+gbp(P.f.p*P.q)+" · "+P.f.name+(P.q>1?" × "+P.q:"")+'</p></div><button class="lnk" onclick="closeSheet()">Cancel</button>');
  clearTimeout(tm);tm=setTimeout(done,2000)
}
function done(){
  if(!P)return;var s=stops();S.seq++;
  S.tickets.push({n:S.op+"-"+String(S.seq).padStart(4,"0"),t:Date.now(),f:P.f.name,q:P.q,amt:P.f.p*P.q,m:P.m,route:S.route,from:s[S.cur],to:s[P.to],fc:C[sq()[S.cur]],tc:C[sq()[P.to]],veh:S.veh,s:false});
  save();P=null;buzz([40,60,40]);
  openSheet('<div class="okc"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="56"/><circle class="rg" cx="60" cy="60" r="56"/><path class="tk" d="M36 62l16 16 32-34"/></svg><span class="sr" role="status">Ticket issued</span></div>',true);
  clearTimeout(tm);tm=setTimeout(function(){$("#sheet").classList.add("fade");tm=setTimeout(closeSheet,360)},1150)
}
function voidLast(){var l=live();if(l.length){l[l.length-1].v=true;save();view()}}
function sync(){setTimeout(function(){S.tickets.forEach(function(t){t.s=true});save();view()},600)}
function endShift(){openSheet('<div class="grab"></div><h2>End shift</h2><div class="rows"><div class="r"><span>Tickets issued</span><b>'+live().length+'</b></div><div class="r"><span>Cash to hand in</span><b>'+gbp(sum("cash"))+'</b></div><div class="r"><span>Card payments</span><b>'+gbp(sum("contactless"))+'</b></div><div class="r"><span>NEC journeys</span><b>'+nec()+'</b></div></div><button class="pp" style="margin-top:16px" onclick="signOff()">Sign off and clear shift</button><button class="lnk" onclick="closeSheet()">Back</button>')}
function signOff(){S.op=null;S.tickets=[];S.seq=0;S.cur=0;save();closeSheet()}
$("#sheet").addEventListener("click",function(e){if(e.target.id==="sheet"&&$("#card").classList.contains("bare"))closeSheet()});
applyTheme();view();
</script>
</body>
</html>
